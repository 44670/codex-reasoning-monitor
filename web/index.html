<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#08090d" />
    <title>Codex Local Intelligence Radar</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='8' fill='%2308090d'/%3E%3Cpath d='M12 18h32l8 8v20H20l-8-8z' fill='none' stroke='%23dcff63' stroke-width='3'/%3E%3Cpath d='M22 42l12-24-3 14h12L29 48l5-13H22' fill='%23dcff63'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/style.css" />
    <script src="/app.js" defer></script>
  </head>
  <body>
    <div class="world-grid" aria-hidden="true"></div>
    <div class="app-shell">
      <header class="masthead">
        <a class="brand" href="/" aria-label="Codex radar home"
          ><span class="brand-icon" aria-hidden="true">⌁</span
          ><span
            ><strong data-i18n="brand"></strong
            ><small
              >LOCAL INTELLIGENCE RADAR<span class="brand-version">
                / 02</span
              ></small
            ></span
          ></a
        >
        <div class="header-controls">
          <span id="connection" class="connection"><i></i><span></span></span
          ><button
            id="demo-toggle"
            class="quiet-button"
            data-i18n="demo"
          ></button>
          <div
            class="language-switch"
            role="group"
            aria-label="Language / 语言"
          >
            <button id="lang-zh" lang="zh-CN">中</button
            ><button id="lang-en" lang="en">EN</button>
          </div>
        </div>
      </header>
      <div id="notice" class="notice" role="status" hidden></div>
      <div
        id="storage-notice"
        class="notice storage-notice"
        role="alert"
        hidden
      ></div>
      <main>
        <section class="hero">
          <div class="hero-copy">
            <div class="eyebrow">
              <span class="live-dot"></span><span data-i18n="eyebrow"></span>
            </div>
            <h1>
              <span data-i18n="headline"></span
              ><em data-i18n="headlineAccent"></em>
            </h1>
            <p class="hero-description" data-i18n="subtitle"></p>
            <div class="hero-method">
              <span class="method-index">01—</span
              ><span data-i18n="method"></span>
            </div>
            <div class="share-module">
              <div class="share-heading">
                <span data-i18n="reasoningShare"></span
                ><strong id="depth-share">—</strong>
              </div>
              <div
                id="share-meter"
                class="share-meter"
                role="meter"
                aria-valuemin="0"
                aria-valuemax="100"
              >
                <span></span>
              </div>
              <div class="share-caption">
                <span data-i18n="peakResponse"></span
                ><span id="latest-output">—</span>
              </div>
            </div>
          </div>
          <div class="instrument">
            <div class="instrument-top">
              <span class="instrument-code">R / DEPTH SENSOR</span
              ><span class="radar-indicator">LIVE</span>
            </div>
            <div class="radar-stage">
              <canvas id="radar" aria-hidden="true"></canvas>
              <div class="depth-readout">
                <span class="readout-label" data-i18n="depthLabel"></span
                ><strong id="depth-value">—</strong
                ><span class="readout-unit">REASONING TOKENS</span
                ><span id="depth-time" class="readout-time"></span>
              </div>
              <span class="scope-mark scope-top">00</span
              ><span class="scope-mark scope-right">90</span
              ><span class="scope-mark scope-bottom">180</span
              ><span class="scope-mark scope-left">270</span>
            </div>
            <div class="instrument-caption">
              <span class="tiny-dot mint"></span
              ><span id="latest-session"></span
              ><span class="caption-arrow">↗</span>
            </div>
            <div class="instrument-bottom">
              <span id="radar-caption"></span
              ><span class="instrument-code">LOCAL / READ ONLY</span>
            </div>
          </div>
        </section>
        <div class="observation-bar">
          <div class="statistics-controls">
            <span class="statistics-title"
              ><span class="tiny-dot mint"></span
              ><span data-i18n="observationLabel"></span
            ></span>
            <div
              class="segments statistics-range"
              role="group"
              aria-label="Time range / 统计范围"
            >
              <button data-range="15">15M</button>
              <button data-range="60">1H</button>
              <button data-range="1440" class="selected">24H</button>
              <button data-range="10080">7D</button>
            </div>
          </div>
          <span
            ><span id="source-label"></span><b id="uptime">00:00:00</b></span
          >
        </div>
        <section class="metrics" aria-label="Overview">
          <article class="metric primary">
            <div class="metric-label">
              <span data-i18n="reasoning"></span
              ><span class="metric-index">01</span>
            </div>
            <div id="reasoning-total" class="metric-number">0</div>
            <div class="metric-foot" data-i18n="sinceLaunch"></div>
          </article>
          <article class="metric">
            <div class="metric-label">
              <span data-i18n="output"></span
              ><span class="metric-index">02</span>
            </div>
            <div id="output-total" class="metric-number">0</div>
            <div class="metric-foot" data-i18n="outputNote"></div>
          </article>
          <article class="metric">
            <div class="metric-label">
              <span data-i18n="sessionsActive"></span
              ><span class="metric-index">03</span>
            </div>
            <div class="metric-number">
              <span id="active-total">0</span
              ><span class="metric-unit" id="waiting-total"></span>
            </div>
            <div class="metric-foot" data-i18n="activeNote"></div>
          </article>
          <article class="metric">
            <div class="metric-label">
              <span data-i18n="responses"></span
              ><span class="metric-index">04</span>
            </div>
            <div id="responses-total" class="metric-number">0</div>
            <div class="metric-foot" id="last-event"></div>
          </article>
        </section>
        <section class="insights">
          <button
            id="filter-516"
            class="insight insight-516"
            aria-pressed="false"
          >
            <span class="insight-label" data-i18n="count516"></span
            ><strong id="count-516">0</strong><span id="ratio-516"></span
            ><small data-i18n="inspect516"></small>
          </button>
          <article class="insight">
            <span class="insight-label" data-i18n="medianLabel"></span
            ><strong id="median-value">—</strong
            ><small data-i18n="medianNote"></small>
          </article>
          <article class="insight">
            <span class="insight-label" data-i18n="p95Label"></span
            ><strong id="p95-value">—</strong
            ><small data-i18n="p95Note"></small>
          </article>
        </section>
        <div class="coverage-line">
          <span id="coverage-label"></span
          ><span data-i18n="coverageNote"></span>
        </div>
        <section class="telemetry">
          <article class="panel chart-panel">
            <div class="panel-heading">
              <div>
                <div class="eyebrow" data-i18n="signalLabel"></div>
                <h2 data-i18n="signalTitle"></h2>
              </div>
            </div>
            <div class="chart-meta">
              <div class="legend">
                <span
                  ><i class="mint"></i
                  ><span data-i18n="reasoningShort"></span></span
                ><span
                  ><i class="purple"></i><span data-i18n="outputShort"></span
                ></span>
              </div>
              <span id="bucket-label"></span>
            </div>
            <div id="chart" class="chart" role="img"></div>
            <div class="chart-caption">
              <span data-i18n="chartNote"></span
              ><span id="chart-window-total"></span>
            </div>
          </article>
          <article class="panel events-panel">
            <div class="panel-heading">
              <div>
                <div class="eyebrow">SIGNAL LOG / 02</div>
                <h2 data-i18n="eventsTitle"></h2>
              </div>
              <button id="pause-events" class="quiet-button"></button>
            </div>
            <div class="events-head">
              <span data-i18n="eventHead"></span
              ><span data-i18n="eventValues"></span>
            </div>
            <div id="events" class="events-list" aria-live="off"></div>
            <div class="events-footer">
              <span id="feed-caption" data-i18n="eventsLimit"></span
              ><button
                id="load-events"
                class="quiet-button"
                data-i18n="loadMore"
              ></button>
            </div>
          </article>
        </section>
        <section class="sessions-section">
          <div class="section-heading">
            <div>
              <span class="section-index">03 /</span>
              <h2 data-i18n="sessionsTitle"></h2>
              <span class="count-badge" id="sessions-count">0</span>
            </div>
            <label class="search"
              ><span aria-hidden="true">⌕</span
              ><input id="search" type="search" autocomplete="off"
            /></label>
          </div>
          <div id="session-filters" class="filters">
            <button data-filter="all" class="selected" data-i18n="all"></button
            ><button data-filter="active" data-i18n="active"></button
            ><button data-filter="waiting" data-i18n="waiting"></button
            ><button data-filter="stopped" data-i18n="stopped"></button>
          </div>
          <div id="sessions" class="sessions-grid"></div>
        </section>
      </main>
      <footer>
        <span class="footer-brand"
          ><span class="tiny-dot mint"></span
          ><span data-i18n="localOnly"></span></span
        ><span data-i18n="disclaimer"></span
        ><span class="mono">127.0.0.1:5927</span>
      </footer>
    </div>
    <dialog id="detail">
      <div class="detail-top">
        <span class="eyebrow" data-i18n="detailTitle"></span
        ><button
          id="close-detail"
          class="icon-button"
          aria-label="Close / 关闭"
        >
          ×
        </button>
      </div>
      <div id="detail-content"></div>
    </dialog>
    <div id="chart-tooltip" class="tooltip" hidden></div>
  </body>
</html>
